# Afterburn Cyber: edition knobs. KEY=VALUE lines only. They are read as data, never sourced.
#
# Runtime (the theme-set hook and the `afterburn` command read these and check every value; a line you
# save yourself in ~/.config/afterburn/afterburn.conf wins over it, and a bad value is ignored):
#   CURSOR_FX    cursor-fx effect: cyber lightning glitch neon phosphor embers shockwave katana teleport
#                fireworks aurora mecha hologram
#   ROTATE       border turn: off | slow (10 s) | medium (5 s) | fast (2.5 s)
#   DIM          dimming of unfocused windows, 0 to 1 (base 0.08)
#   GLOW_RANGE   shadow range at the normal heat level, 4 to 30 (base 14)
#   EMBER_STYLE  lock-screen embers: rise | fall | drift | spark | pulse | burst
# Build time (tools/make-editions.sh puts these in .editions/README.md and the colors.toml header):
#   TAGLINE, PERSONALITY, FEELING
# Motion: slow border, soft glow, slow cascading rain.
CURSOR_FX=phosphor
ROTATE=slow
DIM=0.12
GLOW_RANGE=17
EMBER_STYLE=fall
TAGLINE="Acid green. The grid is listening."
PERSONALITY="3 AM hacker, quiet control."
FEELING="focus, flow, old-terminal comfort"
